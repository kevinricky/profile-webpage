  <script>
    // Restore the visitor's saved theme and accent before first paint (no flash).
    // Defaults (light + business) live on the <html> tag; only valid saved values override them.
    try {
      var d = document.documentElement, t = localStorage.getItem('theme'), a = localStorage.getItem('accent');
      if (t === 'light' || t === 'dark') d.dataset.theme = t;
      if (a && /^[a-z]+$/.test(a)) d.dataset.accent = a;
    } catch (e) {}
  </script>
